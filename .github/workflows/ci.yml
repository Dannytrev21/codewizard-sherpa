# Six-job CI for codewizard-sherpa.
#
# This workflow owns five of the six jobs: `lint`, `typecheck`, `test`,
# `security`, and `fence`. The sixth — `docs` — lives in the sibling
# `.github/workflows/docs.yml` so it can be path-filtered at the workflow
# level (AC-12 Option B); that honors the ≤90s p95 walltime advisory from
# phase-arch-design.md §Testing strategy / CI gates without polluting the
# six-job decomposition with an extra `changes` setup job.
#
# `fence` is the load-bearing ADR-0002 / production-ADR-0005 gate. Do NOT
# disable, broaden, or "simplify" without an ADR amendment.
#
# CODEOWNERS-route this file when CODEOWNERS lands in S5-02; pin reviews to
# phase-arch-design.md §Edge cases #15.
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Default-deny posture (Phase 0). Individual jobs MUST NOT widen `contents`
# beyond `read`; future SARIF uploads in Phase 3+ may add `security-events:
# write` only on the job that needs it. Asserted by tests/unit/test_ci_workflow.py.
permissions:
  contents: read

# One run per ref — new pushes cancel older runs. `cancel-in-progress: true`
# is load-bearing (CI quota); advisory-only would let stale runs burn budget.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: lint — ruff check + ruff format --check + import-linter structural
  # cold-start defense. `make lint-imports` is intentionally invoked here
  # (NOT under `typecheck`) per phase-arch-design.md §Testing strategy / CI
  # gates and S1-05 AC-6.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        os: ["ubuntu-24.04"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: make lint
      - name: Lint imports (import-linter, structural cold-start defense)
        run: make lint-imports

  # ---------------------------------------------------------------------------
  # Job 2: typecheck — mypy --strict on src/.
  # ---------------------------------------------------------------------------
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: Type-check (mypy --strict)
        run: make typecheck

  # ---------------------------------------------------------------------------
  # Job 3: test — full pytest suite. The 85% coverage floor (line + branch)
  # is enforced via `addopts` in pyproject.toml; no per-CI override.
  #
  # The trailing `Per-module coverage carve-outs` step is the load-bearing
  # ADR-0005 enforcement gate: `coverage.py`'s `[tool.coverage.report]
  # fail_under` is global only, so the 85/75 carve-outs for
  # `probes/deployment.py` and `probes/ci.py` are enforced by the script
  # reading `coverage.json` (S4-04 AC-1 / AC-10).
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-24.04
    # 2026-05-19 S4-02: bumped 10 → 15. The previous successful run on
    # 1fa6d4e was 9m57s — at the budget cliff. S4-02 added ~70 unit + 6
    # integration tests + two Hypothesis property suites + a second
    # subprocess-mypy negative; the lane was being cancelled at the 10-min
    # mark. 15 minutes restores the ~5-min headroom future stories will
    # consume.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: Install gitleaks (S6-07 phase02_adv lane)
        # The S6-07 adversarial test (tests/adv/phase02/test_secret_in_source.py)
        # MUST NOT skip — per AC-8 it fails loudly if gitleaks is not on
        # PATH. Pin a known version; SHA-checksum verified upstream.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xzC /usr/local/bin gitleaks
          gitleaks version
      - name: Install scip-typescript (portfolio index_health goldens assert SCIP freshness)
        # The portfolio index_health goldens are recorded with a working
        # scip-typescript on PATH: ScipIndexProbe (B1) indexes each fixture and
        # B2 reports ``scip: {confidence: high, freshness: fresh}``. Without the
        # tool the probe takes the ToolMissingError path and the goldens
        # diverge. ubuntu-24.04 runners ship Node + npm; pin for parity.
        run: |
          set -euo pipefail
          npm install -g @sourcegraph/scip-typescript@0.4.0
          scip-typescript --version
      - name: Run tests
        run: pytest -q --cov-report=json
      - name: Per-module coverage carve-outs (ADR-0005)
        run: python scripts/check_coverage_carve_outs.py coverage.json pyproject.toml
      # S5-01 — bench canaries. `bench-collection-guard` is GATING: if a
      # future change renames the marker or filters a file the collection
      # falls below 3 and the job fails. `bench` itself is ADVISORY
      # (`continue-on-error: true`); the cold-start canary is variance-prone
      # on shared CI runners (`phase-arch-design.md §Edge cases row 12`).
      # `bench-results.json` is uploaded as a workflow artifact so a future
      # PR-comment action (filed against Phase 1) can consume it.
      - name: bench-collection-guard
        run: |
          set -euo pipefail
          collected=$(pytest --collect-only -m bench tests/bench/ -q --no-header --no-cov 2>/dev/null | grep -c '::test_' || true)
          echo "bench tests collected: ${collected}"
          if [ "${collected}" -ne 3 ]; then
            echo "expected exactly 3 bench tests (S5-01); got ${collected}" >&2
            exit 1
          fi
      - name: bench (advisory)
        continue-on-error: true
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: pytest tests/bench/ -m bench -q --tb=short --no-cov
      - name: Upload bench-results.json
        if: always()
        # actions/upload-artifact v4.4.3 — SHA-pinned per ADR-0002. Do NOT
        # replace with `@v4` (floating tag); the SHA is the supply-chain
        # anchor.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job 4: security — pip-audit + osv-scanner against uv.lock.
  # Severity gating: HIGH/CRITICAL fail the job; MEDIUM/LOW are advisory
  # (per phase-arch-design.md §Testing strategy / CI gates job 4).
  # ---------------------------------------------------------------------------
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Install dev extras (pip-audit)
        run: python -m pip install -e ".[dev]"
      - name: pip-audit (PyPI advisories against uv.lock)
        # pip-audit reads name+version from uv.lock entries. The shell
        # pipeline extracts `name = "<x>"` + the adjacent `version = "<y>"`
        # so pip-audit can resolve advisories deterministically without
        # asking pip to re-resolve the environment.
        run: |
          python - <<'PY' > /tmp/requirements-from-uv.txt
          import re, pathlib
          text = pathlib.Path("uv.lock").read_text()
          pkgs = re.findall(r'\[\[package\]\]\s*\nname = "([^"]+)"\nversion = "([^"]+)"', text)
          for name, version in pkgs:
              print(f"{name}=={version}")
          PY
          # ``--no-deps`` is required alongside ``--disable-pip`` per
          # pip-audit's CLI contract (otherwise pip-audit refuses to skip
          # pip resolution unless the requirements file is hashed). We
          # extract concrete name==version pairs from uv.lock above, so
          # there's nothing for pip to re-resolve.
          #
          # ``--ignore-vuln PYSEC-2026-89`` (alias CVE-2025-69534):
          # Python-Markdown unauthenticated DoS, CVSS 7.5, with NO fixed
          # release available (markdown 3.10.2 is the latest and is
          # affected). ``markdown`` is a build-time-only transitive dep of
          # the mkdocs docs toolchain — not in the codegenie runtime closure
          # (proven by the ``fence`` job + import-linter) — and the docs
          # build parses only trusted in-repo .md files. Full rationale +
          # an ``ignoreUntil`` expiry live in ``osv-scanner.toml``; remove
          # both suppressions when Python-Markdown ships a fix.
          pip-audit --strict --disable-pip --no-deps --ignore-vuln PYSEC-2026-89 --requirement /tmp/requirements-from-uv.txt
      - name: osv-scanner (uv.lock)
        # v1.9.1: the action lives at the ``osv-scanner-action`` subpath,
        # NOT the repo root (the root ``action.yml`` has no ``runs:``
        # section by design — see ``CONTRIBUTING.md`` upstream). The SHA
        # remains pinned per ADR-0002.
        #
        # ``--config=osv-scanner.toml`` loads the ignore registry at the
        # repo root (see that file for the PYSEC-2026-89 rationale +
        # expiry). Without it, the un-fixable markdown DoS advisory would
        # trip ``--fail-on-severity=HIGH``.
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638  # v1.9.2
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=uv.lock
            --fail-on-severity=HIGH

  # ---------------------------------------------------------------------------
  # Job 5: fence — the load-bearing ADR-0002 gate.
  #
  # Two phases on purpose:
  #
  #   Phase A (closure measurement, STANDALONE — Phase-0 ADR-0002 / ADR-0006):
  #     bare ``pip install -e .`` + standalone ``pytest`` + run only
  #     ``tests/unit/test_pyproject_fence.py``. The closure measurement
  #     (``scan_installed_distribution``) MUST observe an uncontaminated
  #     ``[project].dependencies`` closure. ``[dev]`` / ``[agents]`` /
  #     ``[service]`` extras are forbidden here — asserted by
  #     ``tests/unit/test_ci_workflow.py::test_fence_job_phase_a_closure_measurement_is_standalone``.
  #
  #   Phase B (path-scoped + audit-lint, FULL DEV — Phase-4 ADR-0003 / S1-05):
  #     after the closure measurement is done, install ``[dev]`` extras and
  #     run all of ``tests/fence/``. This covers the Phase-4 path-scoped
  #     fence (no LLM SDK in gather-pipeline paths; ``anthropic`` single-
  #     callsite; ``chromadb``/``fastembed``/``onnxruntime`` rag-scoped),
  #     the planted-violation negative tests, and the import-linter
  #     audit+lint contracts (``test_lint_imports_catches_planted_leak.py``
  #     needs the ``import-linter`` console script). Mirrors
  #     ``make fence`` so the dedicated CI gate matches the local target
  #     (S1-05 AC-22 — no local/CI divergence on path-scope regressions).
  # ---------------------------------------------------------------------------
  fence:
    name: fence
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Install bare distribution (closure measurement)
        run: pip install -e .
      - name: Install pytest (harness, STANDALONE)
        run: pip install pytest
      - name: Phase A — closure-measurement fence (STANDALONE)
        # ``-o "addopts="`` overrides pyproject's ``--cov=...`` switches
        # which require ``pytest-cov`` — the closure-measurement phase
        # installs ``pytest`` STANDALONE (no [dev]) per ADR-0006 so the
        # gather-pipeline closure measurement stays uncontaminated.
        run: pytest -q -o "addopts=" tests/unit/test_pyproject_fence.py
      - name: Install dev extras (Phase B harness — closure measurement done)
        # MUST come after Phase A. Installing [dev] before would contaminate
        # the closure measurement (Phase-0 ADR-0002 + ADR-0006). The
        # closure-measurement step has already recorded its observation by
        # the time this runs.
        run: python -m pip install -e ".[dev]"
      - name: Phase B — path-scoped + audit-lint fence (S1-05 AC-22)
        # Mirrors ``make fence``. ``--no-cov`` because the fence job has no
        # coverage gate of its own — the ``test`` job owns coverage.
        run: pytest -q -o "addopts=" --no-cov tests/fence/

  # ---------------------------------------------------------------------------
  # Phase-2 named CI lanes (S8-03). The eight names from
  # `phase-arch-design.md §"CI gates"` (fence, contract-freeze, unit,
  # integration, portfolio, adv-phase02, mypy, bench) are a *required subset*
  # of the workflow's job names — the legacy `lint`, `typecheck`, `test`,
  # `security` jobs above stay as-is (no rename, no delete). The new lanes
  # below are additive.
  #
  # All Phase-2 lanes ``needs: [fence]`` so a closure-fence violation short-
  # circuits the whole workflow (no point burning lane minutes if anthropic
  # snuck into the runtime).
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Job 6: contract-freeze — promotes ``tests/unit/test_probe_contract.py``
  # to its own top-level lane with a per-PR diff surface. The regen helper
  # is invoked with ``--check`` so the live ProbeContext field set is diffed
  # against the committed ``probe_contract.v1.json``. A third additive field
  # (anything outside the Phase-0 base ∪ ``image_digest_resolver``) fails
  # with an ADR-0004 pointer (S8-03 AC-11).
  # ---------------------------------------------------------------------------
  contract-freeze:
    name: contract-freeze
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    needs: [fence]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        os: ["ubuntu-24.04"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run probe-contract freeze test
        run: pytest tests/unit/test_probe_contract.py -q --no-cov
      - name: Verify ProbeContext field allowlist (ADR-0004)
        run: python scripts/regen_probe_contract_snapshot.py --check

  # ---------------------------------------------------------------------------
  # Job 7: unit — fast unit-only subset of pytest. Serial (no xdist per
  # ADR-0009). ``--no-cov`` so the global 85% coverage floor stays anchored
  # in the legacy ``test`` job (which still runs the full suite + carve-outs).
  # ---------------------------------------------------------------------------
  unit:
    name: unit
    runs-on: ${{ matrix.os }}
    # 7-min budget: the suite grew past the original 5-min ceiling on 3.12
    # (4881 unit tests in ~4m40s wall + ~30s setup + checkout/teardown).
    # Bumping 5 → 7 gives ~1m headroom rather than rebalancing the lane.
    timeout-minutes: 7
    needs: [fence]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        os: ["ubuntu-24.04"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: Materialize stale-scip fixture
        # ``tests/unit/probes/layer_b/test_index_health_empty_registry_adversarial.py``
        # and ``tests/unit/fixtures/test_stale_scip_gitignore_policy.py`` expect
        # the fixture's runtime state (``.git/`` + ``.codegenie/context/raw/scip.json``)
        # to be present. The session-scoped autouse fixture that regenerates
        # this state lives in ``tests/adv/phase02/conftest.py`` — outside the
        # ``unit`` lane's pytest scope. Regenerate it manually here so the
        # unit lane's discovery scope is self-contained.
        run: |
          set -euo pipefail
          bash tests/fixtures/portfolio/stale-scip/regenerate.sh
      - name: Run unit lane (serial; no xdist; no coverage)
        run: pytest tests/unit/ -q --no-cov

  # ---------------------------------------------------------------------------
  # Job 8: integration — real third-party tool invocations.
  # Tool-presence preflight prints the missing-tool list as the first
  # stdout line so an operator scanning CI logs sees gaps at a glance.
  # Per-test ``@requires_tool`` skips fire with a ``SKIPPED LOUD`` reason
  # (S8-03 AC-3) when a binary isn't on PATH.
  # ---------------------------------------------------------------------------
  integration:
    name: integration
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [fence]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        os: ["ubuntu-24.04"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: Tool-presence preflight (loud)
        run: |
          set -uo pipefail
          for tool in semgrep syft grype gitleaks tree-sitter docker strace scip-typescript; do
            command -v "$tool" >/dev/null || echo "MISSING: $tool"
          done
      - name: Run integration lane (serial; no xdist; no coverage)
        # The ``portfolio`` lane owns ``tests/integration/portfolio/``; we
        # ignore that subdir here so the two lanes don't run the sweep twice.
        run: pytest tests/integration/ --ignore=tests/integration/portfolio -q --no-cov

  # ---------------------------------------------------------------------------
  # Job 9: portfolio — five-fixture sweep + golden diff. ADR-0009: serial,
  # no xdist. 7-min step cap = 6-min budget + 1-min headroom
  # (``phase-arch-design.md §"CI lane"``). Golden-diff failure is a hard
  # fail; ``continue-on-error`` is intentionally absent.
  # ---------------------------------------------------------------------------
  portfolio:
    name: portfolio
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    needs: [fence]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        os: ["ubuntu-24.04"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: Install gitleaks (gitleaks probe is golden-tested in portfolio)
        # The portfolio sweep includes gitleaks-probe golden files. Without
        # gitleaks on PATH the probe returns ``outcome={"kind":"skipped"}``
        # and the committed goldens (recorded with gitleaks present) diverge.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xzC /usr/local/bin gitleaks
          gitleaks version
      - name: Install scip-typescript (index_health goldens assert SCIP freshness)
        # B1 (ScipIndexProbe) indexes each portfolio fixture; B2's index_health
        # golden records ``scip: {confidence: high, freshness: fresh}``. Without
        # the tool the probe hits ToolMissingError and the goldens diverge.
        # ubuntu-24.04 runners ship Node + npm; pin for parity.
        run: |
          set -euo pipefail
          npm install -g @sourcegraph/scip-typescript@0.4.0
          scip-typescript --version
      - name: Materialize stale-scip fixture
        # ``regen_golden.py`` (invoked by ``test_portfolio_sweep`` AC-28) runs
        # against the canonical fixtures. ``stale-scip``'s runtime state is
        # gitignored (S4-02 seed-vs-runtime split); the session-scoped fixture
        # in ``tests/adv/phase02/conftest.py`` doesn't apply to this lane.
        # Regenerate explicitly so the gather sweep matches the committed
        # goldens (which were recorded with the runtime state present).
        run: |
          set -euo pipefail
          bash tests/fixtures/portfolio/stale-scip/regenerate.sh
      - name: Run portfolio lane (serial; no xdist; no coverage)
        run: pytest tests/integration/portfolio/ -q --no-cov --tb=short

  # ---------------------------------------------------------------------------
  # Job 10: adv-phase02 — LOAD-BEARING (S8-03 AC-5). Every Phase-2
  # adversarial test from S4-02 / S5-05 / S5-06 / S6-07 / S7-04 plus the
  # Phase-3 handoff smoke. Any failure here fails the build red — no
  # ``continue-on-error: true``. This is the roadmap exit gate for Phase 2.
  # ---------------------------------------------------------------------------
  adv-phase02:
    name: adv-phase02
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [fence]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        os: ["ubuntu-24.04"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: Install gitleaks (S6-07 dependency)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xzC /usr/local/bin gitleaks
          gitleaks version
      - name: Run adversarial Phase-2 lane (LOAD-BEARING)
        run: pytest tests/adv/phase02/ -q --no-cov --tb=long

  # ---------------------------------------------------------------------------
  # Job 11: mypy — alias job promoting `typecheck` to its Phase-2-canonical
  # name. The legacy `typecheck` job above still runs; `mypy` re-invokes
  # `make typecheck` so the Phase-2-named subset assertion in
  # `phase-arch-design.md §"CI gates"` is satisfied. `warn_unreachable=true`
  # is enforced via the global `[tool.mypy]` block in `pyproject.toml`
  # (S1-11 / S8-01 confirmed).
  # ---------------------------------------------------------------------------
  mypy:
    name: mypy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    needs: [fence]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        os: ["ubuntu-24.04"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: mypy --strict (global warn_unreachable on)
        run: make typecheck

  # ---------------------------------------------------------------------------
  # Job 12: bench — advisory PR-level bench lane (S8-03 AC-7). Runs the
  # two NEW (non-`-m bench`-marker) bench scripts; never blocks merge.
  # ``continue-on-error: true`` is load-bearing — bench variance on shared
  # runners would otherwise red-flag honest PRs. The hosted-runner bench
  # (``bench_portfolio_walltime_hosted_runner.py``) is nightly-only via
  # ``bench-nightly.yml`` and IS gating on its thresholds.
  #
  # ``pull-requests: write`` is granted to this job ONLY so ``gh pr comment``
  # can post regression summaries; ``contents: read`` (workflow-level
  # default) is preserved.
  # ---------------------------------------------------------------------------
  bench:
    name: bench
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [fence]
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        os: ["ubuntu-24.04"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run new bench scripts (advisory)
        continue-on-error: true
        if: ${{ github.event.pull_request.head.repo.fork == false || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          python tests/bench/bench_portfolio_walltime.py || true
          python tests/bench/bench_index_health_overhead.py || true
      - name: Fork-PR bench notice (measurement only)
        if: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          echo "::warning::Fork PR detected; bench comment skipped; measurement artifact only"
          python tests/bench/bench_portfolio_walltime.py || true
          python tests/bench/bench_index_health_overhead.py || true
      - name: Upload bench-results.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bench-results-phase2
          path: bench-results.json
          if-no-files-found: warn
