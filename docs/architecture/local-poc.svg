<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1648" width="1280" height="1648">
<style>
.t{font-family:"Comic Sans MS","Caveat","Patrick Hand",system-ui,sans-serif;}
.title{font-size:26px;fill:#1e1e1e;font-weight:700;}
.sub{font-size:14px;fill:#495057;}
.bandhd{font-size:17px;fill:#1e1e1e;font-weight:700;}
.banddesc{font-size:13px;fill:#495057;}
.boxttl{font-size:15px;fill:#1e1e1e;font-weight:700;}
.boxbody{font-size:12.5px;fill:#1e1e1e;}
.count{font-size:12px;fill:#868e96;font-style:italic;}
.chip{font-size:13px;font-weight:700;}
.chipnum{font-size:11px;fill:#868e96;}
.cap{font-size:12px;fill:#868e96;font-style:italic;}
.panellbl{font-size:12.5px;fill:#495057;font-style:italic;}
</style>
<rect x="0" y="0" width="1280" height="1648" fill="#ffffff"/>
<text x="40" y="50" class="t title">codewizard-sherpa — how the tool works today</text>
<text x="40" y="80" class="t sub">Reads a code repository, then proposes a fix for one known security vulnerability. Every step is deterministic — no AI / LLM anywhere.</text>
<text x="40" y="106" class="t cap">The full workflow — this tool covers the highlighted steps:</text>
<path d="M 50 118 L 180 118 Q 190 118 190 128 L 190 162 Q 190 172 180 172 L 50 172 Q 40 172 40 162 L 40 128 Q 40 118 50 118 Z" fill="#eceef0" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="5,4"/>
<text x="115.0" y="140" text-anchor="middle" class="t chipnum">step 1</text>
<text x="115.0" y="160" text-anchor="middle" class="t chip" fill="#868e96">Discover</text>
<path d="M 225 118 L 355 118 Q 365 118 365 128 L 365 162 Q 365 172 355 172 L 225 172 Q 215 172 215 162 L 215 128 Q 215 118 225 118 Z" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="290.0" y="140" text-anchor="middle" class="t chipnum">step 2</text>
<text x="290.0" y="160" text-anchor="middle" class="t chip" fill="#1e1e1e">Gather context</text>
<path d="M 400 118 L 530 118 Q 540 118 540 128 L 540 162 Q 540 172 530 172 L 400 172 Q 390 172 390 162 L 390 128 Q 390 118 400 118 Z" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="465.0" y="140" text-anchor="middle" class="t chipnum">step 3</text>
<text x="465.0" y="160" text-anchor="middle" class="t chip" fill="#1e1e1e">Plan the fix</text>
<path d="M 575 118 L 705 118 Q 715 118 715 128 L 715 162 Q 715 172 705 172 L 575 172 Q 565 172 565 162 L 565 128 Q 565 118 575 118 Z" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="640.0" y="140" text-anchor="middle" class="t chipnum">step 4</text>
<text x="640.0" y="160" text-anchor="middle" class="t chip" fill="#1e1e1e">Make the change</text>
<path d="M 750 118 L 880 118 Q 890 118 890 128 L 890 162 Q 890 172 880 172 L 750 172 Q 740 172 740 162 L 740 128 Q 740 118 750 118 Z" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="815.0" y="140" text-anchor="middle" class="t chipnum">step 5</text>
<text x="815.0" y="160" text-anchor="middle" class="t chip" fill="#1e1e1e">Validate</text>
<path d="M 925 118 L 1055 118 Q 1065 118 1065 128 L 1065 162 Q 1065 172 1055 172 L 925 172 Q 915 172 915 162 L 915 128 Q 915 118 925 118 Z" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="990.0" y="140" text-anchor="middle" class="t chipnum">step 6</text>
<text x="990.0" y="160" text-anchor="middle" class="t chip" fill="#1e1e1e">Hand off</text>
<path d="M 1100 118 L 1230 118 Q 1240 118 1240 128 L 1240 162 Q 1240 172 1230 172 L 1100 172 Q 1090 172 1090 162 L 1090 128 Q 1090 118 1100 118 Z" fill="#eceef0" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="5,4"/>
<text x="1165.0" y="140" text-anchor="middle" class="t chipnum">step 7</text>
<text x="1165.0" y="160" text-anchor="middle" class="t chip" fill="#868e96">Learn</text>
<text x="202.5" y="152" text-anchor="middle" class="t" font-size="20" fill="#adb5bd">›</text>
<text x="377.5" y="152" text-anchor="middle" class="t" font-size="20" fill="#adb5bd">›</text>
<text x="552.5" y="152" text-anchor="middle" class="t" font-size="20" fill="#adb5bd">›</text>
<text x="727.5" y="152" text-anchor="middle" class="t" font-size="20" fill="#adb5bd">›</text>
<text x="902.5" y="152" text-anchor="middle" class="t" font-size="20" fill="#adb5bd">›</text>
<text x="1077.5" y="152" text-anchor="middle" class="t" font-size="20" fill="#adb5bd">›</text>
<text x="40" y="192" class="t cap">Built and running today: steps 2–6.     ·     Planned: steps 1 and 7.</text>
<path d="M 48 214 L 1232 214 Q 1248 214 1248 230 L 1248 1200 Q 1248 1216 1232 1216 L 48 1216 Q 32 1216 32 1200 L 32 230 Q 32 214 48 214 Z" fill="#f8f9fb" stroke="#adb5bd" stroke-width="2"/>
<text x="56" y="250" class="t bandhd">STEP 2  ·  GATHER CONTEXT</text>
<text x="56" y="273" class="t banddesc">Scan the repository and record the facts — no opinions, just evidence.</text>
<text x="56" y="292" class="t banddesc">Dozens of small, independent checks — the codebase calls them probes — each inspect one aspect of the repo, all running in parallel.</text>
<path d="M 48 1248 L 1232 1248 Q 1248 1248 1248 1264 L 1248 1532 Q 1248 1548 1232 1548 L 48 1548 Q 32 1548 32 1532 L 32 1264 Q 32 1248 48 1248 Z" fill="#f8f9fb" stroke="#adb5bd" stroke-width="2" stroke-dasharray="7,5"/>
<text x="56" y="1284" class="t bandhd">STEPS 3–6  ·  PROPOSE A FIX   (in progress)</text>
<text x="56" y="1307" class="t banddesc">Turn the context report into a review-ready patch for one known vulnerability.</text>
<path d="M 60 608 L 1220 608 Q 1232 608 1232 620 L 1232 968 Q 1232 980 1220 980 L 60 980 Q 48 980 48 968 L 48 620 Q 48 608 60 608 Z" fill="#ffffff" stroke="#ced4da" stroke-width="2"/>
<text x="640.0" y="634" text-anchor="middle" class="t panellbl">The checks  ·  each one inspects a single aspect of the repo and records evidence — never a judgment</text>
<path d="M 482 316 L 798 316 Q 810 316 810 328 L 810 358 Q 810 370 798 370 L 482 370 Q 470 370 470 358 L 470 328 Q 470 316 482 316 Z" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
<text x="640.0" y="338.8" text-anchor="middle" class="t boxttl">Target code repository</text>
<text x="640.0" y="362.8" text-anchor="middle" class="t boxbody">any folder on disk</text>
<path d="M 452 396 L 828 396 Q 840 396 840 408 L 840 444 Q 840 456 828 456 L 452 456 Q 440 456 440 444 L 440 408 Q 440 396 452 396 Z" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="640.0" y="413.5" text-anchor="middle" class="t boxttl">The codegenie command</text>
<text x="640.0" y="437.5" text-anchor="middle" class="t boxbody">a program you run from the terminal</text>
<text x="640.0" y="454.0" text-anchor="middle" class="t boxbody">(reads an optional settings file)</text>
<path d="M 352 484 L 928 484 Q 940 484 940 496 L 940 576 Q 940 588 928 588 L 352 588 Q 340 588 340 576 L 340 496 Q 340 484 352 484 Z" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
<text x="640.0" y="507.0" text-anchor="middle" class="t boxttl">Check runner</text>
<text x="640.0" y="531.0" text-anchor="middle" class="t boxbody">runs every check at the same time, each with a time limit;</text>
<text x="640.0" y="547.5" text-anchor="middle" class="t boxbody">one slow or failed check never blocks the others;</text>
<text x="640.0" y="564.0" text-anchor="middle" class="t boxbody">each check declares which files it reads, so its result is</text>
<text x="640.0" y="580.5" text-anchor="middle" class="t boxbody">cached and re-used when nothing has changed</text>
<path d="M 90 652 L 426 652 Q 438 652 438 664 L 438 786 Q 438 798 426 798 L 90 798 Q 78 798 78 786 L 78 664 Q 78 652 90 652 Z" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="258.0" y="704.2" text-anchor="middle" class="t boxttl">Project basics</text>
<text x="258.0" y="728.2" text-anchor="middle" class="t boxbody">language, build system and dependencies;</text>
<text x="258.0" y="744.8" text-anchor="middle" class="t boxbody">how the code is tested, deployed and built</text>
<text x="258.0" y="761.2" text-anchor="middle" class="t count">~ 6 checks</text>
<path d="M 472 652 L 808 652 Q 820 652 820 664 L 820 786 Q 820 798 808 798 L 472 798 Q 460 798 460 786 L 460 664 Q 460 652 472 652 Z" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="640.0" y="696.0" text-anchor="middle" class="t boxttl">Code structure</text>
<text x="640.0" y="720.0" text-anchor="middle" class="t boxbody">dependency and import graphs, symbol</text>
<text x="640.0" y="736.5" text-anchor="middle" class="t boxbody">indexes — plus a freshness check that</text>
<text x="640.0" y="753.0" text-anchor="middle" class="t boxbody">flags stale analysis data</text>
<text x="640.0" y="769.5" text-anchor="middle" class="t count">~ 7 checks</text>
<path d="M 854 652 L 1190 652 Q 1202 652 1202 664 L 1202 786 Q 1202 798 1190 798 L 854 798 Q 842 798 842 786 L 842 664 Q 842 652 854 652 Z" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="1022.0" y="696.0" text-anchor="middle" class="t boxttl">Security checks</text>
<text x="1022.0" y="720.0" text-anchor="middle" class="t boxbody">known vulnerabilities, software inventory,</text>
<text x="1022.0" y="736.5" text-anchor="middle" class="t boxbody">container setup, and what the code</text>
<text x="1022.0" y="753.0" text-anchor="middle" class="t boxbody">does when it runs</text>
<text x="1022.0" y="769.5" text-anchor="middle" class="t count">~ 7 checks</text>
<path d="M 90 810 L 426 810 Q 438 810 438 822 L 438 944 Q 438 956 426 956 L 90 956 Q 78 956 78 944 L 78 822 Q 78 810 90 810 Z" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="258.0" y="862.2" text-anchor="middle" class="t boxttl">Project knowledge</text>
<text x="258.0" y="886.2" text-anchor="middle" class="t boxbody">the team's own conventions, decision</text>
<text x="258.0" y="902.8" text-anchor="middle" class="t boxbody">records, policies and internal docs</text>
<text x="258.0" y="919.2" text-anchor="middle" class="t count">~ 8 checks</text>
<path d="M 472 810 L 808 810 Q 820 810 820 822 L 820 944 Q 820 956 808 956 L 472 956 Q 460 956 460 944 L 460 822 Q 460 810 472 810 Z" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="640.0" y="862.2" text-anchor="middle" class="t boxttl">Ownership and operations</text>
<text x="640.0" y="886.2" text-anchor="middle" class="t boxbody">who owns the code, how services</text>
<text x="640.0" y="902.8" text-anchor="middle" class="t boxbody">relate, and reliability targets</text>
<text x="640.0" y="919.2" text-anchor="middle" class="t count">~ 3 checks</text>
<path d="M 854 810 L 1190 810 Q 1202 810 1202 822 L 1202 944 Q 1202 956 1190 956 L 854 956 Q 842 956 842 944 L 842 822 Q 842 810 854 810 Z" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="1022.0" y="862.2" text-anchor="middle" class="t boxttl">Targeted scans</text>
<text x="1022.0" y="886.2" text-anchor="middle" class="t boxbody">pattern searches for leaked secrets and</text>
<text x="1022.0" y="902.8" text-anchor="middle" class="t boxbody">risky code, plus test-coverage mapping</text>
<text x="1022.0" y="919.2" text-anchor="middle" class="t count">~ 5 checks</text>
<path d="M 402 1012 L 878 1012 Q 890 1012 890 1024 L 890 1070 Q 890 1082 878 1082 L 402 1082 Q 390 1082 390 1070 L 390 1024 Q 390 1012 402 1012 Z" fill="#c5f6fa" stroke="#1e1e1e" stroke-width="2"/>
<text x="640.0" y="1034.5" text-anchor="middle" class="t boxttl">Validate and write safely</text>
<text x="640.0" y="1058.5" text-anchor="middle" class="t boxbody">check each result, then strip absolute paths</text>
<text x="640.0" y="1075.0" text-anchor="middle" class="t boxbody">and anything secret-shaped before saving</text>
<path d="M 332 1110 L 948 1110 Q 960 1110 960 1122 L 960 1180 Q 960 1192 948 1192 L 332 1192 Q 320 1192 320 1180 L 320 1122 Q 320 1110 332 1110 Z" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
<text x="640.0" y="1138.5" text-anchor="middle" class="t boxttl">Context report</text>
<text x="640.0" y="1162.5" text-anchor="middle" class="t boxbody">saved as repo-context.yaml —</text>
<text x="640.0" y="1179.0" text-anchor="middle" class="t boxbody">the evidence file every later step reads</text>
<path d="M 68 1340 L 306 1340 Q 318 1340 318 1352 L 318 1514 Q 318 1526 306 1526 L 68 1526 Q 56 1526 56 1514 L 56 1352 Q 56 1340 68 1340 Z" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="187.0" y="1395.8" text-anchor="middle" class="t boxttl">Step 3 — Plan the fix</text>
<text x="187.0" y="1419.8" text-anchor="middle" class="t boxbody">Look the vulnerability up in a</text>
<text x="187.0" y="1436.2" text-anchor="middle" class="t boxbody">local database built from public</text>
<text x="187.0" y="1452.8" text-anchor="middle" class="t boxbody">vulnerability databases (NVD,</text>
<text x="187.0" y="1469.2" text-anchor="middle" class="t boxbody">GHSA, OSV), then choose a</text>
<text x="187.0" y="1485.8" text-anchor="middle" class="t boxbody">deterministic fix recipe.</text>
<path d="M 370 1340 L 608 1340 Q 620 1340 620 1352 L 620 1514 Q 620 1526 608 1526 L 370 1526 Q 358 1526 358 1514 L 358 1352 Q 358 1340 370 1340 Z" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
<text x="489.0" y="1404.0" text-anchor="middle" class="t boxttl">Step 4 — Make the change</text>
<text x="489.0" y="1428.0" text-anchor="middle" class="t boxbody">Apply the recipe — for example,</text>
<text x="489.0" y="1444.5" text-anchor="middle" class="t boxbody">upgrade the vulnerable package</text>
<text x="489.0" y="1461.0" text-anchor="middle" class="t boxbody">— to produce the actual code</text>
<text x="489.0" y="1477.5" text-anchor="middle" class="t boxbody">change.</text>
<path d="M 672 1340 L 910 1340 Q 922 1340 922 1352 L 922 1514 Q 922 1526 910 1526 L 672 1526 Q 660 1526 660 1514 L 660 1352 Q 660 1340 672 1340 Z" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="791.0" y="1404.0" text-anchor="middle" class="t boxttl">Step 5 — Validate</text>
<text x="791.0" y="1428.0" text-anchor="middle" class="t boxbody">Build and test the patched code</text>
<text x="791.0" y="1444.5" text-anchor="middle" class="t boxbody">inside a locked-down sandbox</text>
<text x="791.0" y="1461.0" text-anchor="middle" class="t boxbody">that cannot reach the network</text>
<text x="791.0" y="1477.5" text-anchor="middle" class="t boxbody">or the rest of the machine.</text>
<path d="M 974 1340 L 1212 1340 Q 1224 1340 1224 1352 L 1224 1514 Q 1224 1526 1212 1526 L 974 1526 Q 962 1526 962 1514 L 962 1352 Q 962 1340 974 1340 Z" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
<text x="1093.0" y="1404.0" text-anchor="middle" class="t boxttl">Step 6 — Hand off</text>
<text x="1093.0" y="1428.0" text-anchor="middle" class="t boxbody">Write the change as a patch on</text>
<text x="1093.0" y="1444.5" text-anchor="middle" class="t boxbody">a new branch. A person reviews</text>
<text x="1093.0" y="1461.0" text-anchor="middle" class="t boxbody">and merges it — the tool never</text>
<text x="1093.0" y="1477.5" text-anchor="middle" class="t boxbody">merges by itself.</text>
<path d="M 42 1574 L 1238 1574 Q 1248 1574 1248 1584 L 1248 1612 Q 1248 1622 1238 1622 L 42 1622 Q 32 1622 32 1612 L 32 1584 Q 32 1574 42 1574 Z" fill="#ffe8cc" stroke="#1e1e1e" stroke-width="2"/>
<text x="640.0" y="1604" text-anchor="middle" class="t boxbody">Guardrail — an automated build check blocks any AI / LLM library from ever entering this pipeline. The tool is deterministic by construction.</text>
<path d="M 640 370 L 640 394" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/>
