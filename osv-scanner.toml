# osv-scanner ignore registry.
#
# osv-scanner auto-discovers this file when it scans `uv.lock` from the repo
# root; the `security` job in `.github/workflows/ci.yml` also passes it
# explicitly via `--config=osv-scanner.toml`. Every entry MUST carry a
# `reason` and an `ignoreUntil` so a suppression re-surfaces for review
# instead of silently persisting forever.

[[IgnoredVulns]]
id = "PYSEC-2026-89"  # alias CVE-2025-69534
ignoreUntil = 2026-08-18
reason = "Python-Markdown unauthenticated DoS (CVSS 7.5): malformed HTML-like input makes html.parser raise an uncaught AssertionError. No fixed release exists — markdown 3.10.2 is the latest and is affected (advisory range is introduced:0 with no fix event). `markdown` enters this repo ONLY as a build-time transitive dependency of the mkdocs docs toolchain (mkdocs / mkdocs-material / pymdown-extensions); it is NOT in the codegenie runtime closure (proven by the `fence` job + import-linter), and the docs build parses only trusted in-repo .md files — there is no attacker-controlled-Markdown path. Remove this entry (and the mirrored `--ignore-vuln` in ci.yml) once Python-Markdown ships a fixed release — tracking issue Python-Markdown/markdown#1534."

[[IgnoredVulns]]
id = "MAL-2026-4750"
ignoreUntil = 2026-08-25
reason = "Malicious-packages advisory against fastapi 0.136.3 — **withdrawn 2026-05-26T13:04:03Z** per OSV (api.osv.dev/v1/vulns/MAL-2026-4750 carries the `withdrawn` field). Original advisory was about fastapi's `[project.optional-dependencies] standard` extra silently pulling the typosquat `fastar` dep; we install bare `fastapi` as a transitive of `chromadb` (path-scoped to src/codegenie/rag/ per ADR-04-0003), and the `[standard]` extra is NOT in our closure. The advisory was correctly withdrawn but pip-audit / osv-scanner still surface it until their OSV mirrors catch up. Remove this entry (and the mirrored `--ignore-vuln` in ci.yml) once both mirrors honor the `withdrawn` flag — typically within 1-2 weeks of the OSV update."

[[IgnoredVulns]]
id = "GHSA-jg22-mg44-37j8"  # alias CVE-2026-34993
ignoreUntil = 2026-09-04
reason = "aiohttp deserialization-of-untrusted-data advisory (fixed in 3.14.0): `CookieJar.load()` on attacker-controlled input may allow arbitrary code execution. We are pinned to aiohttp 3.13.5 because the dev-only cassette tool `vcrpy` (8.1.1, the latest release) imports `aiohttp.streams.AsyncStreamReaderMixin`, which 3.14.0 removed; lifting the `aiohttp<3.14` cap in pyproject.toml breaks the cassette integration tests at import time. NOT reachable in our usage: aiohttp is a transitive dep only (chromadb / fastembed, path-scoped to src/codegenie/rag/ per ADR-04-0003, plus the kubernetes client) — `grep -r 'import aiohttp' src/` is empty, and codegenie never calls `CookieJar.load()`. OSV itself notes this is 'unlikely to affect many applications'. Remove this entry (and the mirrored `--ignore-vuln CVE-2026-34993` in ci.yml) once vcrpy ships aiohttp-3.14 compatibility and the `aiohttp<3.14` cap is lifted."

[[IgnoredVulns]]
id = "GHSA-hg6j-4rv6-33pg"  # alias CVE-2026-47265
ignoreUntil = 2026-09-04
reason = "aiohttp cross-origin-redirect cookie-leak advisory (fixed in 3.14.0): cookies set via the per-request `cookies=` parameter are re-sent after a cross-origin redirect, leaking them to an attacker who controls the redirect. We are pinned to aiohttp 3.13.5 for the same vcrpy 8.1.1 incompatibility as GHSA-jg22-mg44-37j8 (vcrpy imports a symbol 3.14.0 removed; lifting the `aiohttp<3.14` cap breaks the cassette integration tests). NOT reachable in our usage: aiohttp is a transitive dep only (chromadb / fastembed, path-scoped to src/codegenie/rag/, plus kubernetes) — `grep -r 'import aiohttp' src/` is empty, and codegenie issues no per-request-cookie requests subject to attacker-controlled cross-origin redirects. Remove this entry (and the mirrored `--ignore-vuln CVE-2026-47265` in ci.yml) once vcrpy ships aiohttp-3.14 compatibility and the `aiohttp<3.14` cap is lifted."
