[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "codewizard-sherpa"
description = "codewizard-sherpa — autonomous agentic system that opens PRs to modify code across repos at portfolio scale (local POC)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "codewizard-sherpa contributors" }]
keywords = ["codegenie", "codewizard-sherpa", "agent", "gather"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
  "Topic :: Software Development",
]
dynamic = ["version"]

# Gather-pipeline runtime closure — what the `fence` CI job (ADR-0002) guards.
# Adding an LLM SDK here is a violation of production ADR-0005 / phase ADR-0002
# / CLAUDE.md §"No LLM anywhere in the gather pipeline".
dependencies = [
  "click",
  "pyyaml",
  "jsonschema>=4.21",
  "pydantic>=2",
  "blake3",
  "structlog",
  # S1-10: ``codegenie.depgraph`` ships the ``DepGraphStrategy`` alias whose
  # return type is ``networkx.DiGraph``; the strategy registry imports
  # ``networkx`` at runtime (TYPE_CHECKING + dispatch). The Phase-3 DepGraphProbe
  # (S4-05) serialises via ``nx.node_link_data``. Stays in the runtime closure
  # (not [project.optional-dependencies]) because the fence (ADR-0002) reads
  # only ``[project].dependencies``; the gather pipeline imports it eagerly.
  "networkx>=3.2",
  # Phase 2 ADR-0011: tree-sitter grammars via PyPI wheels (supersedes
  # 02-ADR-0002's vendored .so model). The ``tree-sitter`` runtime supplies
  # the modern ``Language(<PyCapsule>)`` API; the per-language wheels supply
  # the grammar capsules. Cross-platform out-of-the-box: linux x86_64/
  # aarch64, macOS Intel/Apple Silicon, Windows. ``pip --require-hashes``
  # carries the supply-chain pin formerly held by ``tools/grammars.lock``.
  # Named-trigger consumer is ``localv2.md §5.2 B3`` (tree-sitter import
  # graph) + S4-06 ``NodeReflectionProbe``; Phase 8+ adds
  # ``tree-sitter-python``/``tree-sitter-java`` additively (one dep line per
  # language).
  "tree-sitter>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<1",
  "tree-sitter-javascript>=0.23,<1",
  # Phase 3 S3-02: ``VulnIndex`` uses Alembic for sqlite schema migrations.
  # Alembic is invoked **in-process** via ``alembic.command.upgrade(cfg, "head")``
  # (no subprocess, no ``ALLOWED_BINARIES`` amendment). Lazy-imported inside
  # :meth:`VulnIndex._upgrade` so ``import codegenie.vuln_index`` keeps
  # ``alembic``/``sqlalchemy`` out of ``sys.modules`` (AC-L2; cold-start
  # fence). Not in ``FORBIDDEN_LLM_SDKS`` — fence (ADR-0002) unaffected.
  "alembic>=1.13",
  # Phase 3 S5-02: ``NpmLockfileRecipeEngine`` parses + re-serialises
  # ``package.json`` / ``package-lock.json`` with ``orjson`` — the production
  # JSON parser (arch §C12). ``OPT_INDENT_2`` (no key-sort) is the
  # byte-identical round-trip pin for the deterministic-recipe contract (G4).
  # Not an LLM SDK — ``fence`` (ADR-0002) and the import-linter LLM contracts
  # are unaffected.
  "orjson>=3.9",
  # Phase 3 S6-01: the two-stream ``EventLog`` compresses each event stream as
  # ``jsonl.zst``. Each ``emit`` appends one self-contained zstd frame (level
  # 3) so a torn trailing frame never corrupts the prior BLAKE3 chain.
  # ``read_across_frames=True`` (zstandard >= 0.21) decodes the concatenated
  # frames on replay. Not an LLM SDK — the ``fence`` (ADR-0002) and the
  # import-linter LLM contracts are unaffected.
  "zstandard>=0.22",
  # Phase 4 S1-05 / ADR-0003: the Anthropic Python SDK is the *single
  # gather-pipeline-external* leaf LLM client. Admitted closure-wide but
  # **path-scoped** — `tests/fence/test_pyproject_fence_phase4.py` enforces that
  # only `src/codegenie/fallback/leaf/anthropic_adapter.py` may import it; every
  # path under `GATHER_PIPELINE_PATHS` (`probes/`, `coordinator/`, `cache/`,
  # `output/`, `schema/`) stays LLM-free. Not in `FORBIDDEN_LLM_SDKS` — the
  # set narrowed (`anthropic` moved out) when this admission landed; six other
  # SDKs (including `sentence-transformers` + `torch`) remain denied
  # closure-wide.
  "anthropic>=0.40.0,<1.0.0",
  # Phase 4 S1-05 / ADR-0003: persistent embedded vector store backing the RAG
  # retriever. Admitted closure-wide but **path-scoped** — only modules under
  # `src/codegenie/rag/` may import it (enforced by
  # `tests/fence/test_pyproject_fence_phase4.py`). Not in `FORBIDDEN_LLM_SDKS`.
  "chromadb>=0.5,<1.0",
  # Phase 4 S1-05 / ADR-0003: ONNX-runtime embeddings backend used by the RAG
  # ingest path. Admitted closure-wide but **path-scoped** — only modules under
  # `src/codegenie/rag/` may import it. Not in `FORBIDDEN_LLM_SDKS`; the
  # `sentence-transformers` / `torch` alternative stack stays denied
  # closure-wide so we don't leave a hole for a future swap-in.
  "fastembed>=0.3,<1.0",
  # Phase 4 S1-05 / ADR-0003: ONNX inference session the fastembed runtime
  # depends on directly. Path-scoped to `src/codegenie/rag/` alongside fastembed.
  "onnxruntime>=1.18,<2.0",
  # Phase 4 S1-05 / ADR-0003: OS keychain loader used by
  # `AnthropicLeafAdapter.__init__` to source the Anthropic API key. Admitted
  # closure-wide *without* path-scope — `keyring` is not LLM-shaped (any module
  # that needs to load a secret may do so). Phase-0 ADR-0002 unaffected:
  # `keyring` was never in the LLM-SDK deny-list.
  "keyring>=24,<26",
]

[project.optional-dependencies]
# Intentionally empty — its existence marks the slot semantically; the runtime
# closure is `[project.dependencies]` itself (ADR-0006 §Decision).
gather = []

# Harness extras. AC-7 of S1-01 invokes ruff/mypy/pytest; S1-04 needs
# pre-commit; S1-04's `mkdocs build --strict` needs mkdocs-material.
# Additional entries (import-linter, pip-audit, osv-scanner, bandit) are owned
# by S1-04 / S1-05; the floor below is the minimum to keep Phase 0 boots green.
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  # 02 S1-01: Hypothesis is the property-test runner for the IndexFreshness
  # round-trip deliverable named in 02-ADR-0006 §Consequences.
  "hypothesis",
  "mypy",
  # Exact-pinned. CI installs the dev extras with plain `pip install -e
  # ".[dev]"`, which does NOT read `uv.lock` — so an unpinned `ruff` let CI
  # silently float to a newer formatter than the one `uv.lock` and the
  # `ruff-pre-commit` SHA (v0.15.12) agree on. ruff 0.16.0 added Markdown
  # code-block formatting and reformatted 422 `docs/**/*.md` files, including
  # `docs/localv2.md` — the byte-for-byte source of truth for the frozen probe
  # contract (ADR-0007). Keep this version in lockstep with `uv.lock` and
  # `.pre-commit-config.yaml`; `test_ruff_is_exact_pinned_and_matches_lockfile`
  # fails if they drift apart.
  "ruff==0.15.12",
  "pre-commit",
  "mkdocs-material",
  # S1-05: structural cold-start defense + supply-chain scanner. `osv-scanner`
  # is a Go binary; it ships via google/osv-scanner-action in CI rather than
  # through this list. `bandit` belongs to a later phase.
  "import-linter",
  "pip-audit",
  # S2-05: `codegenie.schema.validator` imports `jsonschema`; the package is
  # not py.typed so mypy --strict needs the stub distribution.
  "types-jsonschema",
  # S3-03: `codegenie.output.writer` imports `yaml`; PyYAML ships no inline
  # types so mypy --strict needs the stub distribution. Already mirrored in
  # the pre-commit mypy hook's `additional_dependencies` list.
  "types-PyYAML",
  # S5-06 (Phase 2 adversarial Dockerfile test): `psutil` reads the runner's
  # subprocess tree to assert the forkbomb fixture stayed contained inside
  # its cgroup. Test-only — NOT in `[project.dependencies]`. Phase 0 fence
  # (ADR-0002) is unaffected: `psutil` is not in the LLM-import blocklist
  # and the `[gather]` runtime closure does not import it.
  "psutil",
  "types-psutil",
  # S3-04 (Phase 4 cassette-discipline): pytest-recording is the vcrpy-on-pytest
  # wrapper whose ``vcr_config`` fixture this story's ``tests/conftest.py``
  # populates with ``before_record_request`` / ``before_record_response`` hooks
  # (ADR-0014). **Dev-only** — runtime closure unchanged; the Phase-0 LLM-SDK
  # fence (`FORBIDDEN_LLM_SDKS`) is unaffected because pytest-recording / vcrpy
  # are not in the denied set and ``[gather]`` does not import them.
  "pytest-recording",
  # The former ``aiohttp<3.14`` cap lived here. vcrpy 8.1.1 imported
  # ``aiohttp.streams.AsyncStreamReaderMixin`` at module load in its aiohttp
  # stub and aiohttp 3.14.0 removed that symbol, so the cap kept the cassette
  # integration tests importable. vcrpy 8.3.0 ships the compatibility shim
  # (``vcr/stubs/aiohttp_stubs.py`` now version-detects the ``stream_writer``
  # ClientResponse argument and defines the async-iteration helpers directly
  # instead of inheriting the removed mixin), so the cap is lifted — 2026-07-25.
  #
  # Lifting it is a security fix, not just hygiene: the cap was pinning aiohttp
  # to 3.13.5, which carries **nine** advisories fixed in 3.14.0/3.14.1
  # (PYSEC-2026-237, -2106..-2113) on top of the two that CI was explicitly
  # suppressing (CVE-2026-34993, CVE-2026-47265 — both ignore flags are now
  # removed from `ci.yml` and `osv-scanner.toml`).
]

# Phase 9+ slot — Temporal, Postgres clients land here.
service = []

# Phase-0 ADR-0006 reserved this slot for "Phase 4+ LLM SDKs" via extras;
# superseded by Phase-4 ADR-0003 (S1-05), which admits anthropic / chromadb /
# fastembed / onnxruntime into `[project.dependencies]` under a **path-scoped
# fence** (`tests/fence/test_pyproject_fence_phase4.py`). Phase 6's expected
# `langgraph` admission is anticipated to path-scope likewise — see ADR-0003
# §Consequences. The slot stays declared (empty) as a semantic marker so the
# supersedure is visible in-place; do not delete it.
agents = []

[project.scripts]
codegenie = "codegenie.__main__:main"

[tool.hatch.version]
path = "src/codegenie/version.py"
# Default regex doesn't tolerate the PEP 526 annotation
# (`__version__: str = "..."`); broaden it to accept an optional `: <type>`.
pattern = "^__version__(?:\\s*:\\s*[^=]+)?\\s*=\\s*['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["src/codegenie"]
# Phase 3 S5-04: the codegenie-owned lockfile policy is a non-Python asset
# loaded at runtime via `importlib.resources`. Hatchling already ships files
# under `packages`, but this makes the wheel dependency explicit so a future
# build-config change cannot silently drop it.
artifacts = ["src/codegenie/transforms/policy/lockfile-policy.yaml"]

[tool.hatch.build.targets.sdist]
include = [
  "src/codegenie",
  "README.md",
  "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Quality toolchain (story S1-02). One source of truth per phase-arch §Tradeoffs
# — no separate .ruff.toml, no setup.cfg. Later phases extend selected rules
# only by addition; weakening T201 / T20 (the "no print() in src/" invariant
# from phase-arch-design.md §Harness engineering / Logging strategy) requires
# an ADR amendment.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
# S7-01 — pre-commit's `identify` library classifies `.gyp` files as
# Python (they share Python-like grammar), so ruff parses them by
# default and trips B018 ("useless expression") on the bare-dict body
# of `tests/fixtures/portfolio/native-modules/binding.gyp`. The file
# is RFC-8259 JSON, NOT Python — exclude it from ruff. Future
# `binding.gyp` fixtures inherit this exclusion via the glob.
# `force-exclude = true` makes the exclusion apply even when ruff is
# invoked with the file path explicitly (pre-commit's invocation
# pattern).
extend-exclude = ["**/binding.gyp"]
force-exclude = true

[tool.ruff.lint]
# Minimum viable rule set — later phases extend by addition.
# T201 (print) is load-bearing: all logging goes through structlog.
select = ["E", "F", "I", "B", "UP", "T201"]

[tool.ruff.lint.per-file-ignores]
# `codegenie.probes.base` is byte-for-byte `localv2.md §4` (ADR-0007). The
# §4 source has aligned trailing comments (E501) and a declarative empty
# `cache_key` method (B027) — both deliberate by the doc and not editable
# code-side. Adding a third entry here requires updating ADR-0007.
"src/codegenie/probes/base.py" = ["E501", "B027"]
# S8-04 — Phase-3 handoff issue bodies are markdown text embedded as string
# literals; wrapping at 100 cols would break the assertion-by-substring tests
# in `tests/unit/docs/test_phase3_handoff_issues.py` and obscure the prose.
"scripts/_phase3_handoff_issues.py" = ["E501"]

[tool.ruff.format]
# `codegenie.probes.base` is excluded from ruff format because the doc
# (`localv2.md §4`) is the source of truth and uses aligned trailing
# comments + no blank line between successive `@dataclass` declarations.
# Letting ruff reformat the file would silently drift it away from §4.
#
# Markdown is excluded for the same reason, one level up. ruff 0.16+ formats
# Python snippets inside fenced code blocks, and `docs/localv2.md §4` *is* the
# doc this exclusion protects `base.py` against drifting from — letting the
# formatter collapse §4's aligned trailing comments would rewrite the source of
# truth itself and trip `tests/unit/test_probe_contract.py`. Docs are prose we
# own by hand (several snippets carry `<slug>`-style placeholders that are not
# valid Python); ruff owns `.py`, not `.md`.
exclude = ["src/codegenie/probes/base.py", "**/*.md"]

[tool.mypy]
python_version = "3.11"
strict = true
# warn_unreachable is a strict-extra; --strict does NOT enable it. Without
# this, dead-code-after-narrowing slips through silently.
warn_unreachable = true

[[tool.mypy.overrides]]
# tests/ runs under relaxed typing — fixtures and parametrize tables routinely
# use untyped defs. Strict checking still applies to fixture *types* (we do not
# set ignore_errors), only to def-level annotations.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# `codegenie.probes.base` is the frozen contract surface (ADR-0007). Its
# methods are declared with ellipsis bodies (`...`) verbatim from
# `localv2.md §4` — per ADR-0007 the doc is the source of truth and code
# may not deviate. mypy's `empty-body` check is silenced here ONLY so the
# contract surface can match §4 byte-for-byte; everything else under
# `codegenie.*` stays under `--strict`.
module = "codegenie.probes.base"
disable_error_code = ["empty-body"]

[[tool.mypy.overrides]]
# `pyarn` is an optional Phase 1 dependency gated by ADR-0003's land-time
# selection (S3-03 chose hand-rolled). When it IS installed (parity-test
# CI matrix job per S3-04 AC-2), mypy reports `import-untyped` because
# pyarn ships no `py.typed` marker; when NOT installed it reports
# `import-not-found`. `ignore_missing_imports` covers both states with
# one declaration so `_yarn._pyarn_parse` does not need a brittle
# per-line ignore that flips on every install-state toggle.
module = ["pyarn", "pyarn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# S1-10: `networkx` 3.x does not yet ship a `py.typed` marker (the stubs
# bundled with the library use `# type: ignore` patterns internally rather
# than a public typed surface). `ignore_missing_imports` keeps the
# `codegenie.depgraph` strategy alias importable under `mypy --strict`
# without polluting the registry module with per-line ignores. The
# `DepGraphStrategy` alias still carries the structural contract
# (`Callable[[ProbeContext, list[Mapping[str, Any]]], DiGraph]`) at the
# Python type level.
module = ["networkx", "networkx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Phase 4 S4-01 — `fastembed` does not ship a `py.typed` marker (as of
# v0.8). `ignore_missing_imports` keeps `codegenie.rag.embedder` and
# `codegenie.rag.cli` clean under `mypy --strict` without polluting the
# source with per-line `# type: ignore`s. The path-scoped fence
# (`tests/fence/test_pyproject_fence_phase4.py`) restricts `fastembed`
# usage to `src/codegenie/rag/` so the silenced typing area is the
# minimum possible.
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Phase 7 S1-01 — `codegenie.primitives.vuln_provenance.registry` is the
# Phase 7 ADR-0004 home for the `Layer` / `Ecosystem` enums; the module
# lands in S2-01. Until then, the TYPE_CHECKING-guarded forward references
# in `codegenie.types.identifiers` (used by the `ProvenanceAdapterId` type
# alias) point at a not-yet-existent module. `ignore_missing_imports` lets
# the alias compile under `mypy --strict` while the alias contract — a
# `tuple[Layer, Ecosystem]` keyed registry — stays statically declared.
# Remove this override when S2-01 lands the registry module.
module = ["codegenie.primitives.vuln_provenance.registry"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# asyncio_mode = "auto" lets coroutine tests run without @pytest.mark.asyncio
# — S3-05's coordinator tests depend on this.
asyncio_mode = "auto"
testpaths = ["tests"]
# `pythonpath = ["."]` so `tests/unit/test_probe_contract.py` (S2-02) can
# import the regen helpers from the bare `scripts/regen_probe_contract_snapshot.py`
# script without promoting `scripts/` to a package.
pythonpath = ["."]
# Default selection skips `bench` (advisory canaries — S5-01). Contributors
# get a fast local loop; CI's `bench` job uses `-m bench` explicitly to opt
# the three canaries in. `--strict-markers` then forces every `pytest.mark.*`
# to be declared below.
# Coverage ratchet (see docs/contributing.md §Project conventions): the
# `--cov-fail-under=85` floor below is the Phase 0 global gate. Phase 1
# (this phase) leaves the global unchanged in S4-04 and raises it to 90/80
# in S6-02 with the 85/75 per-module carve-outs declared in
# `[tool.coverage_carve_outs]` already in place (ADR-0005). Do NOT raise
# ahead.
addopts = "-ra --strict-markers -m \"not bench and not phase_7_preview\" --cov=src/codegenie --cov-branch --cov-fail-under=85"
# Registered markers. `bench` partitions the advisory cold-start /
# coordinator-overhead / cache-hit-dispatch canaries that ship in
# `tests/bench/` (S5-01); they never gate merge — the structural
# cold-start defense is `import-linter` (S1-05).
markers = [
  "bench: advisory performance canaries — not run under the default suite",
  "adv: adversarial-fixture corpus tests (Phase 1 §S5-01/02/03)",
  "phase02_adv: Phase 2 adversarial tests (CI-gating; see tests/adv/phase02/)",
  "phase04_adv: Phase 4 adversarial tests (CI-gating; see tests/adv/phase04/)",
  "serial: tests that MUST run serially (ADR-0009 — pytest-xdist veto)",
  "nightly_macos: macOS-substrate live tests run only on the nightly darwin runner (S4-03 AC-12)",
  "phase_7_preview: Phase 7 preview tests; skipped in Phase 3 CI by default — collected only with -m phase_7_preview",
  "uses_anthropic_cassette: live Anthropic cassette tests (S3-02 reserves the marker; S3-04/S3-05/S3-06 land the discipline)",
  "fastembed: tests that load real BGE-small ONNX weights via fastembed — require `codegenie embeddings bootstrap` to have run (S4-01)",
]

[tool.coverage.run]
branch = true
source = ["src/codegenie"]

[tool.coverage.report]
# cli.py is the ONLY architecturally-permitted coverage exemption per
# phase-arch-design.md §Testing strategy / Test pyramid (CLI plumbing is
# exercised end-to-end by S4-02's smoke test, not by unit-level coverage).
omit = ["src/codegenie/cli.py"]

# ---------------------------------------------------------------------------
# Per-module coverage carve-outs (ADR-0005). Declared as data so the script
# (`scripts/check_coverage_carve_outs.py`) and the CI-enforced test
# (`tests/unit/build/test_coverage_carve_outs.py`) read from one source.
#
# Why: `codegenie.probes.deployment` and `codegenie.probes.ci` have
# structurally-narrow branches (one `if` per supported CI provider /
# deployment marker) that make the higher 90/80 floor gameable by
# branch-checkbox tests asserting nothing meaningful — the exact Rule 9
# violation the carve-out was designed to prevent. See ADR-0005 §Tradeoffs
# and Global Rule 9 ("Tests verify intent, not just behavior") for the
# load-bearing rationale; the adversarial-fixture corpus carries
# behavioural correctness, coverage is supporting.
#
# The global `--cov-fail-under` is NOT raised in S4-04; S6-02 ratchets it to
# 90/80 with these 85/75 carve-outs already in place. Splitting the
# declaration from the ratchet is deliberate per
# `docs/phases/01-context-gather-layer-a-node/High-level-impl.md §Step 4`.
#
# Further carve-outs require a new ADR amending 0005. Adding a third row
# here without that ADR fails
# `tests/unit/build/test_coverage_carve_outs.py::test_carve_out_table_has_exactly_two_entries`.
# Each entry records BOTH the file path AND the dotted module name so a
# half-applied rename PR surfaces the drift via the same test.
# ---------------------------------------------------------------------------

[[tool.coverage_carve_outs.entries]]
path = "src/codegenie/probes/deployment.py"
module = "codegenie.probes.deployment"
line = 85
branch = 75
adr = "phase-01/ADR-0005"

[[tool.coverage_carve_outs.entries]]
path = "src/codegenie/probes/ci.py"
module = "codegenie.probes.ci"
line = 85
branch = 75
adr = "phase-01/ADR-0005"

# ---------------------------------------------------------------------------
# import-linter — structural cold-start defense (story S1-05, ADR phase-0006).
# Replaces the phase-arch-design-flagged flaky CLI timing canary with two
# `type: forbidden` contracts that block heavy modules from `codegenie.cli`
# (the CLI entry surface, lands in S4-02) and `codegenie` (the package's
# `__init__.py`, operative immediately). The blocklist is scoped to exact
# module names — NOT `codegenie.cli.**` — per High-level-impl.md §Step 1
# §Risks specific to this step (over-block warning).
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["codegenie"]
# Required by import-linter v2 when `forbidden_modules` names third-party
# (external) packages — the import graph must traverse them to reason about
# transitive imports.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "codegenie.cli must not top-level import heavy modules"
type = "forbidden"
source_modules = ["codegenie.cli"]
forbidden_modules = ["yaml", "jsonschema", "pydantic", "blake3", "structlog"]
# S3-03 (phase 02): the writer-signature tightening narrows
# ``_seam_*_envelope`` parameters to ``RedactedSlice``. The class is
# imported under ``if TYPE_CHECKING:`` so the runtime cold-start
# contract is preserved (Python evaluates ``TYPE_CHECKING`` as
# ``False``); the runtime ``isinstance`` checks lazy-import the class
# via ``importlib.import_module``. The static import-linter graph
# nevertheless sees the type-only edge and would flag it as a pydantic
# violation — whitelist it here so the spirit of the contract (no eager
# pydantic at import time) stays kept while the typed annotation
# survives.
ignore_imports = ["codegenie.cli -> codegenie.output.redacted_slice"]

[[tool.importlinter.contracts]]
name = "codegenie (__init__) must not top-level import heavy modules"
type = "forbidden"
source_modules = ["codegenie"]
# `as_packages = false` scopes the source to JUST `codegenie/__init__.py`,
# not the whole `codegenie.*` tree. The cold-start defense is "what does the
# CLI entry import eagerly?" — submodules (codegenie.logging, codegenie.cache,
# …) are imported lazily by cli.py and may freely depend on heavy modules.
# Without this flag, adding any submodule that imports structlog/yaml/pydantic
# breaks the contract, which is over-broad vs. the documented intent.
as_packages = false
forbidden_modules = ["yaml", "jsonschema", "pydantic", "blake3", "structlog"]

# ---------------------------------------------------------------------------
# ADR-0013 Amendment 2026-05-20 — `PackageManager`'s definition home moved to
# the kernel-tier `codegenie.types.identifiers` so `types` stops depending on
# the `probes` leaf (the inversion broke a 28-module cold-start cycle). This
# contract is the static guard that the inversion never returns; the runtime
# guard is the all-green `tests/fence/test_per_submodule_cold_start.py` sweep.
# ---------------------------------------------------------------------------

[[tool.importlinter.contracts]]
name = "codegenie.types.identifiers must not import the probes package"
type = "forbidden"
source_modules = ["codegenie.types.identifiers"]
forbidden_modules = ["codegenie.probes"]

# ---------------------------------------------------------------------------
# Phase 3 LLM-SDK contracts (S1-05). The whole `codegenie.{plugins,transforms}`
# tree must remain LLM-SDK-free — Phase 3 is the deterministic-recipe loop,
# and the gather-pipeline ADR-0002 closure already excludes these SDKs from
# the runtime distribution. These contracts use `as_packages = true` so every
# submodule under the package is scanned (NOT just the `__init__.py`), since
# the threat is a future module importing anthropic / openai / etc.
#
# The names mirror `codegenie._fence.FORBIDDEN_LLM_SDKS` after canonicalization
# (PEP 503) — drift is asserted by
# `tests/fence/test_phase3_importlinter_contracts_shape.py`. `sentence_transformers`
# is the **import** form (underscore) because import-linter scans actual
# `import …` statements; `_fence.FORBIDDEN_LLM_SDKS` uses the canonical
# **distribution** form (`sentence-transformers`, hyphen). Both spellings
# canonicalize to the same name — see Phase-4 S1-05 / ADR-0003. `anthropic`
# is intentionally absent: it is a path-scoped runtime dep at the leaf adapter
# (single callsite enforced by `tests/fence/test_pyproject_fence_phase4.py`).
# ---------------------------------------------------------------------------

[[tool.importlinter.contracts]]
name = "codegenie.plugins must not import LLM SDKs"
type = "forbidden"
source_modules = ["codegenie.plugins"]
as_packages = true
forbidden_modules = ["langgraph", "openai", "langchain", "transformers", "sentence_transformers", "torch"]

[[tool.importlinter.contracts]]
name = "codegenie.transforms must not import LLM SDKs"
type = "forbidden"
source_modules = ["codegenie.transforms"]
as_packages = true
forbidden_modules = ["langgraph", "openai", "langchain", "transformers", "sentence_transformers", "torch"]

# ---------------------------------------------------------------------------
# Phase 7 LLM-SDK contract (S1-06). The `codegenie.primitives.vuln_provenance`
# tree is becoming kernel surface (Phase 7 ADR-0004 — bounded-additive
# primitive home). The fence extends the gather-pipeline ADR-0002 / production
# ADR-0005 closure to the new primitive. `as_packages = true` is load-bearing:
# without it only `__init__.py` would be scanned and submodules
# (`types`, `protocols`, `errors`, `syft_reader`) would leak. The five forbidden
# names mirror `codegenie._fence.FORBIDDEN_LLM_SDKS`; drift is asserted by
# `tests/fence/test_phase7_importlinter_contracts_shape.py`.
# ---------------------------------------------------------------------------

[[tool.importlinter.contracts]]
name = "phase-7 primitive does not import LLM SDKs"
type = "forbidden"
source_modules = ["codegenie.primitives.vuln_provenance"]
as_packages = true
include_external_packages = true
# Mirrors `_fence.FORBIDDEN_LLM_SDKS` after PEP-503 canonicalization (S1-05 / ADR-0003).
# `sentence_transformers` (underscore = import name) here; `sentence-transformers`
# (hyphen = distribution name) in `FORBIDDEN_LLM_SDKS`. `anthropic` is intentionally
# absent — path-scoped to the leaf adapter, enforced separately by
# `tests/fence/test_pyproject_fence_phase4.py`.
forbidden_modules = ["openai", "langchain", "langgraph", "transformers", "sentence_transformers", "torch"]

# ---------------------------------------------------------------------------
# Phase 4 (ADR-0003) path-scoped admissions — the lint-time belt-and-suspenders
# alongside the pytest fence tests/fence/test_pyproject_fence_phase4.py (S1-05).
# `ignore_imports` is intentionally absent: the admitted edges
# (anthropic_adapter -> anthropic, rag.store -> chromadb, rag.embedder ->
# fastembed/onnxruntime) do not exist yet. import-linter's `forbidden` contract
# defaults `unmatched_ignore_imports_alerting = ERROR`, so whitelisting a
# not-yet-existent edge would break `make lint-imports`. Each downstream story
# (S3-02, S4-01, S4-03) appends its own `ignore_imports` line when it lands the
# real import — extension by addition, audit trail stays honest.
# ---------------------------------------------------------------------------

[[tool.importlinter.contracts]]
name = "ADR-0003: gather pipeline must not import phase-4 admitted or forbidden packages"
type = "forbidden"
as_packages = true
source_modules = [
  "codegenie.probes",
  "codegenie.coordinator",
  "codegenie.cache",
  "codegenie.output",
  "codegenie.schema",
]
forbidden_modules = [
  "anthropic",
  "chromadb",
  "fastembed",
  "onnxruntime",
  "langgraph",
  "openai",
  "langchain",
  "transformers",
  "sentence_transformers",
  "torch",
]

[[tool.importlinter.contracts]]
name = "ADR-0003: anthropic may be imported only by the leaf adapter"
type = "forbidden"
as_packages = true
source_modules = ["codegenie"]
forbidden_modules = ["anthropic"]
# S3-02 lands the one permitted edge — the adapter is the sole `import anthropic`
# site in the codebase. The path-scoped fence
# (`tests/fence/test_pyproject_fence_phase4.py` + dedicated
# `tests/fence/test_only_leaf_imports_anthropic.py`) provides the AST-level
# guard; this ignore_imports is the lint-time belt-and-suspenders.
ignore_imports = [
  "codegenie.fallback.leaf.anthropic_adapter -> anthropic",
]

[[tool.importlinter.contracts]]
name = "ADR-0003: chromadb may be imported only under codegenie.rag"
type = "forbidden"
as_packages = true
source_modules = ["codegenie"]
forbidden_modules = ["chromadb"]
# S4-03 admits the single rag-substrate module authorized to import
# chromadb: `store` (the in-tree `ChromaPersistentStore` adapter behind
# the `SolvedExampleStore` Protocol). Any new admission requires an ADR
# amendment.
ignore_imports = [
  "codegenie.rag.store -> chromadb",
]

[[tool.importlinter.contracts]]
name = "ADR-0003: fastembed and onnxruntime may be imported only under codegenie.rag"
type = "forbidden"
as_packages = true
source_modules = ["codegenie"]
forbidden_modules = ["fastembed", "onnxruntime"]
# S4-01 admits the two rag-substrate modules authorized to import the
# fastembed runtime: `embedder` (refuse-start verification + embed()
# shell) and `cli` (the single bootstrap callsite, per ADR-0007). Any
# new admission requires an ADR amendment.
ignore_imports = [
  "codegenie.rag.embedder -> fastembed",
  "codegenie.rag.cli -> fastembed",
]

# ---------------------------------------------------------------------------
# Phase-4 S2-05 — ``BudgetToken`` two-frame capability scope (ADR-0010).
# The token flows through exactly two frames at runtime
# (``FallbackTier → LeafLlm.invoke``). To make ``import-linter`` express that
# at the module-level granularity it operates on, ``BudgetToken`` was split
# out into its own submodule ``codegenie.fallback.budget_token`` (the
# issuer ``codegenie.fallback.budget`` re-exports it for ergonomic back-
# compat — the re-export is the single whitelisted edge below).
#
# Each downstream story appends its own ``ignore_imports`` line for the
# allowed importers when the module lands — extension by addition, mirroring
# the ADR-0003 path-scoped admission pattern above:
#   - S3-01 (leaf protocol port): codegenie.fallback.leaf.port -> codegenie.fallback.budget_token
#                                 (Protocol signature ``token: BudgetToken``;
#                                 ADR-0010 §Consequences pins the type-level
#                                 capability at this seam.)
#   - S3-02 (anthropic_adapter):  codegenie.fallback.leaf.anthropic_adapter -> codegenie.fallback.budget_token
#   - S6-01 (fallback tier):     codegenie.fallback.tier -> codegenie.fallback.budget_token
# ---------------------------------------------------------------------------

[[tool.importlinter.contracts]]
name = "ADR-0010: BudgetToken is two-frame scoped"
type = "forbidden"
as_packages = true
# `source_modules` enumerates every `codegenie.*` subpackage EXCEPT
# `codegenie.fallback.budget_token` itself — import-linter's `forbidden`
# contract requires source and forbidden trees to be disjoint (otherwise it
# raises "Modules have shared descendants"). Sibling submodules of
# `codegenie.fallback` are listed individually so the codegenie.fallback
# subtree is fully covered minus the forbidden submodule. The
# `tests/fence/test_budget_token_scope.py` shape test pins this list so
# future additions to the codegenie tree are surfaced (Rule 12 — fail loud).
source_modules = [
  "codegenie.adapters",
  "codegenie.cache",
  "codegenie.catalogs",
  "codegenie.config",
  "codegenie.conventions",
  "codegenie.coordinator",
  "codegenie.depgraph",
  "codegenie.exec",
  "codegenie.fallback.anchor_writer",
  "codegenie.fallback.attempt_anchor",
  "codegenie.fallback.budget",
  "codegenie.fallback.cassette",
  "codegenie.fallback.confidence_gate",
  "codegenie.fallback.contracts",
  "codegenie.fallback.fence",
  "codegenie.fallback.leaf",
  "codegenie.fallback.plan_outcome",
  "codegenie.fallback.plan_proposal",
  "codegenie.fallback.post_validation_context",
  "codegenie.fallback.provenance_gate",
  "codegenie.fallback.tier",
  "codegenie.grammars",
  "codegenie.indices",
  "codegenie.output",
  "codegenie.parsers",
  "codegenie.plugins",
  "codegenie.primitives",
  "codegenie.probes",
  "codegenie.rag",
  "codegenie.report",
  "codegenie.schema",
  "codegenie.skills",
  "codegenie.tccm",
  "codegenie.transforms",
  "codegenie.types",
  "codegenie.vuln_index",
  "codegenie.workflows",
]
forbidden_modules = ["codegenie.fallback.budget_token"]
ignore_imports = [
  "codegenie.fallback.budget -> codegenie.fallback.budget_token",
  "codegenie.fallback.leaf.port -> codegenie.fallback.budget_token",
  "codegenie.fallback.leaf.anthropic_adapter -> codegenie.fallback.budget_token",
]

# ---------------------------------------------------------------------------
# Phase-4 S4-06 / ADR-0016 — the interim ``_phase4_local_capability_mint``
# lives at ``codegenie.rag._capability_mint`` and may be imported only by
# ``codegenie.rag.ingest`` (the writer surface). Symbol-level bypasses
# (``from codegenie.rag.ingest import _phase4_local_capability_mint``)
# are policed by the AST sweep in
# ``tests/fence/test_phase4_capability_mint_scope.py`` — import-linter is
# module-level and cannot see that boundary.
#
# Phase 5 ``GateRunner`` lands the production
# ``codegenie.gates._capability_mint.mint_solved_example_capability`` and
# appends its ``ignore_imports`` edge when that module exists. We do NOT
# pre-allow it today: import-linter 2.x treats unmatched
# ``ignore_imports`` rows as errors (S1-06 lesson).
# ---------------------------------------------------------------------------

[[tool.importlinter.contracts]]
name = "ADR-0016: phase4 solved-example mint module is scoped"
type = "forbidden"
# `source_modules` enumerates every `codegenie.*` subpackage. We cannot
# pass the bare `codegenie` package: `import-linter`'s `forbidden`
# contract rejects a source tree that contains the forbidden module as a
# descendant ("Modules have shared descendants"). The ADR-0010
# BudgetToken contract above is the precedent. `codegenie.rag` is listed
# as a package so the contract covers every sibling of
# `codegenie.rag._capability_mint` under that subtree — the lone
# whitelisted edge is the `codegenie.rag.ingest -> ...` row in
# `ignore_imports`.
source_modules = [
  "codegenie.adapters",
  "codegenie.cache",
  "codegenie.catalogs",
  "codegenie.config",
  "codegenie.conventions",
  "codegenie.coordinator",
  "codegenie.depgraph",
  "codegenie.exec",
  "codegenie.fallback",
  "codegenie.grammars",
  "codegenie.indices",
  "codegenie.output",
  "codegenie.parsers",
  "codegenie.plugins",
  "codegenie.primitives",
  "codegenie.probes",
  # `codegenie.rag.*` siblings of `_capability_mint` are listed
  # individually here — listing the bare `codegenie.rag` package would
  # trigger import-linter's "Modules have shared descendants" rejection
  # (the forbidden module is a descendant of the source). The
  # ADR-0010 BudgetToken contract above uses the same pattern for
  # `codegenie.fallback.*`.
  "codegenie.rag.cli",
  "codegenie.rag.embedder",
  "codegenie.rag.embedding_cache",
  "codegenie.rag.errors",
  "codegenie.rag.ingest",
  "codegenie.rag.models",
  "codegenie.rag.provenance",
  "codegenie.rag.store",
  "codegenie.report",
  "codegenie.schema",
  "codegenie.skills",
  "codegenie.tccm",
  "codegenie.transforms",
  "codegenie.types",
  "codegenie.vuln_index",
  "codegenie.workflows",
]
as_packages = true
forbidden_modules = ["codegenie.rag._capability_mint"]
ignore_imports = [
  "codegenie.rag.ingest -> codegenie.rag._capability_mint",
  # Phase-4 S4-07 — the rebuild CLI is the second sanctioned mint
  # call-site (ADR-0016 §"operational-recovery"). Story AC-2/AC-13
  # pin reuse of the mint rather than a parallel `_rebuild_capability`.
  "codegenie.rag.cli -> codegenie.rag._capability_mint",
  # Phase-4 S6-03 — the FallbackTier.on_validated harvest hook is the
  # third sanctioned mint call-site (ADR-04-0009 §Decision: inline
  # auto-harvest wired into FallbackTier). Mint is called keyword-only
  # inside on_validated; S6-03 AC-10 pins the import shape.
  "codegenie.fallback.tier -> codegenie.rag._capability_mint",
]
